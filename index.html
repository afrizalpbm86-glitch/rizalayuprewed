<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Wedding of Afrizal & Ayu Julita</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { font-family: 'Poppins', sans-serif; background: #FDF6EC; color: #5D4037; }

    #cover {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999;
      background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)), url('https://picsum.photos/800/1200') center/cover;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; color: #fff; transition: 1s;
    }
    #cover.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    #cover h1 { font-family: 'Great Vibes', cursive; font-size: 50px; color: #FFD700; margin: 10px 0; }
    .btn-buka {
      padding: 14px 35px; background: #FFD700; color: #5D4037; border: none;
      border-radius: 30px; font-weight: 600; font-size: 16px; cursor: pointer; margin-top: 20px;
    }

    .swiper { width: 100%; height: 100vh; }
    .swiper-slide {
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; padding: 40px 20px; background-size: cover; background-position: center;
    }
    .slide-content { background: rgba(253,246,236,0.9); padding: 30px; border-radius: 15px; max-width: 600px; }
    .slide-judul { font-family: 'Great Vibes', cursive; font-size: 42px; color: #A0522D; margin-bottom: 20px; }
    .nama-besar { font-family: 'Great Vibes', cursive; font-size: 38px; color: #A0522D; margin: 10px 0; }
    
    .countdown { display: flex; gap: 10px; margin: 25px 0; justify-content: center; }
    .countdown-box { background: #8D6E63; color: #fff; padding: 10px; border-radius: 8px; min-width: 65px; }
    .countdown-box .angka { font-size: 24px; font-weight: 600; display: block; }
    
    .swiper-pagination-bullet-active { background: #FFD700; }
    .btn-music {
      position: fixed; bottom: 25px; right: 25px; width: 50px; height: 50px; border-radius: 50%;
      background: #8D6E63; color: #fff; border: 2px solid #fff; font-size: 22px; cursor: pointer; z-index: 999;
    }
  </style>
</head>
<body>

  <div id="cover">
    <p>THE WEDDING OF</p>
    <h1>Afrizal & Ayu Julita</h1>
    <p>11 . 07 . 2026</p>
    <button class="btn-buka" onclick="bukaUndangan()">Buka Undangan</button>
  </div>

  <div class="swiper main-swiper">
    <div class="swiper-wrapper">
      
      <div class="swiper-slide" style="background-image: url('https://picsum.photos/800/1201');">
        <div class="slide-content">
          <div class="slide-judul">Save The Date</div>
          <div class="nama-besar">Afrizal & Ayu</div>
          <div class="countdown">
            <div class="countdown-box"><span class="angka" id="hari">00</span><span class="label">Hari</span></div>
            <div class="countdown-box"><span class="angka" id="jam">00</span><span class="label">Jam</span></div>
            <div class="countdown-box"><span class="angka" id="menit">00</span><span class="label">Menit</span></div>
            <div class="countdown-box"><span class="angka" id="detik">00</span><span class="label">Detik</span></div>
          </div>
        </div>
      </div>

      <div class="swiper-slide" style="background-image: url('https://picsum.photos/800/1202');">
        <div class="slide-content">
          <div class="slide-judul">The Groom</div>
          <div class="nama-besar">Afrizal</div>
          <p>Putra dari Bapak Ahmad & Ibu Siti</p>
        </div>
      </div>

      <div class="swiper-slide" style="background-image: url('https://picsum.photos/800/1203');">
        <div class="slide-content">
          <div class="slide-judul">The Bride</div>
          <div class="nama-besar">Ayu Julita</div>
          <p>Putri dari Bapak Bambang & Ibu Lina</p>
        </div>
      </div>

      <div class="swiper-slide" style="background-image: url('https://picsum.photos/800/1204');">
        <div class="slide-content">
          <div class="slide-judul">Akad & Resepsi</div>
          <p><strong>Sabtu, 11 Juli 2026</strong><br>Masjid Agung Palembang</p>
        </div>
      </div>

    </div>
    <div class="swiper-pagination"></div>
  </div>

  <button class="btn-music" onclick="toggleMusic()">🔇</button>
  <audio id="bgMusic" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  
  <script>
    // TUNGGU HALAMAN KE-LOAD DULU BARU JALANIN - INI YANG BIKIN TADI GAGAL
    document.addEventListener('DOMContentLoaded', function() {
      
      // 1. FUNGSI BUKA
      window.bukaUndangan = function() {
        document.getElementById('cover').classList.add('hidden');
        playMusicOnce();
      }

      // 2. SLIDE SHOW - INI UDAH PASTI JALAN
      const swiper = new Swiper('.main-swiper', {
        direction: 'horizontal',
        loop: true,
        autoplay: { delay: 3000, disableOnInteraction: false },
        pagination: { el: '.swiper-pagination', clickable: true },
      });

      // 3. MUSIK
      let musikPlay = false;
      const audio = document.getElementById('bgMusic');
      const btnMusic = document.querySelector('.btn-music');
      
      function playMusicOnce() {
        if (!musikPlay) {
          audio.play().then(() => {
            musikPlay = true;
            btnMusic.innerHTML = '🔊';
          }).catch(e => {});
        }
      }

      window.toggleMusic = function() {
        if (audio.paused) { audio.play(); btnMusic.innerHTML = '🔊'; } 
        else { audio.pause(); btnMusic.innerHTML = '🔇'; }
      }
      
      // 4. COUNTDOWN
      const tanggalAcara = new Date("July 11, 2026 08:00:00").getTime();
      setInterval(function() {
        const selisih = tanggalAcara - new Date().getTime();
        if(selisih < 0) return;
        document.getElementById("hari").innerHTML = Math.floor(selisih / 86400000);
        document.getElementById("jam").innerHTML = Math.floor((selisih % 86400000) / 3600000);
        document.getElementById("menit").innerHTML = Math.floor((selisih % 3600000) / 60000);
        document.getElementById("detik").innerHTML = Math.floor((selisih % 60000) / 1000);
      }, 1000);

    });
  </script>
</body>
</html>
