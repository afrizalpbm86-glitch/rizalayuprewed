<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>The Wedding of Afrizal & Ayu</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; position: fixed; width: 100%; }
    /* position: fixed = ANTI LONCAT DI HP */

    #cover {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999;
      background: url('https://images.unsplash.com/photo-1519741497674-611481863552?w=800') center/cover;
      display: flex; justify-content: center; align-items: center; flex-direction: column; color: #fff;
    }
    #cover.hidden { display: none; }
    .btn-buka { padding: 15px 30px; background: gold; border: none; border-radius: 30px; font-size: 18px; margin-top: 20px; cursor: pointer; }

    .swiper { width: 100%; height: 100%; }
    .swiper-slide { background: #000; }
    .swiper-slide img {
      width: 100%; height: 100%; object-fit: cover;
      /* COVER = PENUH LAYAR, GAK KEPOTONG KALO FOTO LANDSCAPE */
    }
    .slide-content {
      position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); padding: 20px; border-radius: 10px; color: #fff; text-align: center; width: 85%;
    }
    .slide-content h2 { color: gold; font-size: 32px; margin-bottom: 10px; }
    
    .swiper-pagination-bullet-active { background: gold; }
  </style>
</head>
<body>

  <div id="cover">
    <h1>Afrizal & Ayu</h1>
    <p>11 Juli 2026</p>
    <button class="btn-buka" onclick="document.getElementById('cover').classList.add('hidden')">Buka Undangan</button>
  </div>

  <div class="swiper">
    <div class="swiper-wrapper">
      
      <!-- SLIDE 1 - PAKE FOTO ONLINE -->
      <div class="swiper-slide">
        <img src="https://images.unsplash.com/photo-1519225421980-715cb0215aed?w=800" alt="Slide 1">
        <div class="slide-content">
          <h2>Save The Date</h2>
          <p>Afrizal & Ayu Julita</p>
        </div>
      </div>

      <!-- SLIDE 2 - PAKE FOTO ONLINE -->
      <div class="swiper-slide">
        <img src="https://images.unsplash.com/photo-1529636798458-921d6f76f9bf?w=800" alt="Slide 2">
        <div class="slide-content">
          <h2>The Groom</h2>
          <p>Afrizal</p>
        </div>
      </div>

      <!-- SLIDE 3 - PAKE FOTO ONLINE -->
      <div class="swiper-slide">
        <img src="https://images.unsplash.com/photo-1583939003579-730e3918a45a?w=800" alt="Slide 3">
        <div class="slide-content">
          <h2>The Bride</h2>
          <p>Ayu Julita</p>
        </div>
      </div>

      <!-- SLIDE 4 - PAKE FOTO ONLINE -->
      <div class="swiper-slide">
        <img src="https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?w=800" alt="Slide 4">
        <div class="slide-content">
          <h2>Akad & Resepsi</h2>
          <p>11 Juli 2026, Palembang</p>
        </div>
      </div>

    </div>
    <div class="swiper-pagination"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    // TUNGGU SEMUA GAMBAR KE LOAD BARU JALANIN SLIDE
    window.onload = function() {
      const swiper = new Swiper('.swiper', {
        loop: true,
        autoplay: { delay: 3000, disableOnInteraction: false },
        pagination: { el: '.swiper-pagination', clickable: true },
      });
    };
  </script>
</body>
</html>
