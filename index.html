<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Wedding of Afrizal & Ayu Julita</title>
  
  <meta property="og:title" content="The Wedding of Afrizal & Ayu Julita" />
  <meta property="og:description" content="11 Juli 2026" />
  <meta property="og:image" content="./cover.webp" />
  
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Poppins', sans-serif; background: #FDF6EC; color: #5D4037; overflow-x: hidden; }

    /* COVER - TOMBOL UDAH 100% BISA DI KLIK */
    #cover {
      position: fixed; top: 0; left: 0; width: 100%; height: 100vh; z-index: 9999;
      background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)), url('./cover.webp') center/cover no-repeat;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; color: #fff; transition: 1s;
    }
    #cover.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    #cover .the-wedding { font-size: 14px; letter-spacing: 4px; margin-bottom: 15px; }
    #cover h1 { font-family: 'Great Vibes', cursive; font-size: 55px; color: #FFD700; margin: 10px 0; line-height: 1.1; }
    #cover .tanggal { font-size: 16px; letter-spacing: 2px; margin: 20px 0 30px 0; }
    .btn-buka {
      padding: 14px 35px; background: #FFD700; color: #5D4037; border: none;
      border-radius: 30px; font-weight: 600; font-size: 16px; cursor: pointer;
      box-shadow: 0 4px 15px rgba(255,215,0,0.4); position: relative; z-index: 10000;
    }

    /* SLIDE */
    .swiper { width: 100%; height: 100vh; }
    .swiper-slide {
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; padding: 40px 20px; background-size: cover; background-position: center;
      position: relative;
    }
    .swiper-slide::before {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(253,246,236,0.85); z-index: 1;
    }
    .slide-content { position: relative; z-index: 2; max-width: 600px; }
    .slide-judul { font-family: 'Great Vibes', cursive; font-size: 48px; color: #A0522D; margin-bottom: 20px; }
    .nama-besar { font-family: 'Great Vibes', cursive; font-size: 42px; color: #A0522D; margin: 10px 0 5px 0; }
    .slide-teks { font-size: 15px; line-height: 1.8; margin-bottom: 20px; }
    
    /* COUNTDOWN */
    .countdown { display: flex; gap: 10px; margin: 25px 0; justify-content: center; flex-wrap: wrap; }
    .countdown-box { background: #8D6E63; color: #fff; padding: 10px; border-radius: 8px; min-width: 65px; border: 1px solid #FFD700; }
    .countdown-box .angka { font-size: 24px; font-weight: 600; display: block; }
    .countdown-box .label { font-size: 11px; }
    
    .swiper-pagination-bullet { width: 12px; height: 12px; background: #8D6E63; opacity: 0.5; }
    .swiper-pagination-bullet-active { background: #FFD700; opacity: 1; }
    
    .btn-music {
      position: fixed; bottom: 25px; right: 25px; width: 50px; height: 50px; border-radius: 50%;
      background: #8D6E63; color: #fff; border: 2px solid #fff; font-size: 22px;
      cursor: pointer; z-index: 999; display: flex; justify-content: center; align-items: center;
    }
    
    .watermark-ads-center {
      text-align: center; padding: 12px 10px; font-size: 11px; font-weight: 600; color: #FFD700;
      background: rgba(0, 0, 0, 0.7); letter-spacing: 1px; position: fixed; bottom: 0; width: 100%; z-index: 998;
    }
    .watermark-ads-center a { color:#FFD700; text-decoration:none; font-weight:700; }
    
    @media only screen and (max-width: 768px) {
      #cover h1 { font-size: 45px; }
      .slide-judul { font-size: 36px; }
      .nama-besar { font-size: 32px; }
    }
  </style>
</head>
<body>

  <!-- COVER -->
  <div id="cover">
    <div class="the-wedding">THE WEDDING OF</div>
    <h1>Afrizal & Ayu Julita</h1>
    <div class="tanggal">11 . 07 . 2026</div>
    <button class="btn-buka" onclick="bukaUndangan()">Buka Undangan</button>
  </div>

  <!-- SLIDE -->
  <div class="swiper main-swiper">
    <div class="swiper-wrapper">
      
      <!-- SLIDE 1: SAVE THE DATE -->
      <div class="swiper-slide" style="background-image: url('./bg1.webp');">
        <div class="slide-content">
          <div class="slide-judul">Save The Date</div>
          <div class="nama-besar">Afrizal & Ayu</div>
          <div class="countdown">
            <div class="countdown-box"><span class="angka" id="hari">00</span><span class="label">Hari</span></div>
            <div class="countdown-box"><span class="angka" id="jam">00</span><span class="label">Jam</span></div>
            <div class="countdown-box"><span class="angka" id="menit">00</span><span class="label">Menit</span></div>
            <div class="countdown-box"><span class="angka" id="detik">00</span><span class="label">Detik</span></div>
          </div>
        </div>
      </div>

      <!-- SLIDE 2: AKAD -->
      <div class="swiper-slide" style="background-image: url('./bg1.webp');">
        <div class="slide-content">
          <div class="slide-judul">Akad Nikah</div>
          <p class="slide-teks">Sabtu, 11 Juli 2026<br>Pukul 08:00 WIB<br><br>Masjid Agung Nur Arafah</p>
        </div>
      </div>

      <!-- SLIDE 3: RESEPSI -->
      <div class="swiper-slide" style="background-image: url('./bg1.webp');">
        <div class="slide-content">
          <div class="slide-judul">Resepsi</div>
          <p class="slide-teks">Sabtu, 11 Juli 2026<br>Pukul 10:00 - 14:00 WIB<br><br>Gedung Serbaguna Palembang</p>
        </div>
      </div>

    </div>
    <div class="swiper-pagination"></div>
  </div>

  <button class="btn-music" onclick="toggleMusic()">🔇</button>
  <audio id="bgMusic" loop>
    <source src="./lagu.mp3" type="audio/mpeg">
  </audio>

  <div class="watermark-ads-center">
    ⚡ ADS Creative | <a href="https://wa.me/6285273150178?text=Mau%20order%20undangan" target="_blank">Order WA</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  
  <script>
    // 1. FUNGSI BUKA UNDANGAN - INI YANG BIKIN TOMBOL JALAN
    function bukaUndangan() {
      document.getElementById('cover').classList.add('hidden');
      playMusicOnce();
    }

    // 2. SWIPER SLIDE
    const swiper = new Swiper('.main-swiper', {
      direction: 'horizontal',
      loop: true,
      pagination: { el: '.swiper-pagination', clickable: true },
    });

    // 3. MUSIK
    let musikPlay = false;
    const audio = document.getElementById('bgMusic');
    const btnMusic = document.querySelector('.btn-music');
    
    function playMusicOnce() {
      if (!musikPlay) {
        audio.play().then(() => {
          musikPlay = true;
          btnMusic.innerHTML = '🔊';
        }).catch(e => {});
      }
    }

    function toggleMusic() {
      if (audio.paused) { audio.play(); btnMusic.innerHTML = '🔊'; } 
      else { audio.pause(); btnMusic.innerHTML = '🔇'; }
    }
    
    // 4. COUNTDOWN - INI UDAH BENER POSISINYA
    const tanggalAcara = new Date("July 11, 2026 08:00:00").getTime();
    setInterval(function() {
      const selisih = tanggalAcara - new Date().getTime();
      if(selisih < 0) {
        document.querySelector(".countdown").innerHTML = "<h3 style='color:#A0522D;'>Acara Sedang Berlangsung</h3>";
        return;
      }
      document.getElementById("hari").innerHTML = Math.floor(selisih / 86400000);
      document.getElementById("jam").innerHTML = Math.floor((selisih % 86400000) / 3600000);
      document.getElementById("menit").innerHTML = Math.floor((selisih % 3600000) / 60000);
      document.getElementById("detik").innerHTML = Math.floor((selisih % 60000) / 1000);
    }, 1000);
  </script>
</body>
</html>
